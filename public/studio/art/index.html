<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro Time Machine — Quella</title><style>html,body{margin:0;background:#0b0c10;color:#dcc878}canvas{display:block;width:100%!important;height:auto!important;image-rendering:pixelated}#status{font:14px monospace;padding:20px}a{color:inherit}@media(pointer:fine){html,body,canvas,a{cursor:none!important}}#artCursor{position:fixed;left:0;top:0;width:30px;height:38px;z-index:100;pointer-events:none;translate:-5px -5px;background:url('../assets/magic-wand.svg') center/contain no-repeat;image-rendering:pixelated;filter:drop-shadow(0 0 5px #ff91e8)}.art-spark{position:fixed;z-index:99;pointer-events:none;width:5px;height:5px;background:#fff5a8;box-shadow:5px 0 #ff7ac8,-5px 0 #73e3ff,0 5px #fff,0 -5px #f7a2ff;animation:art-spark .52s steps(5) forwards}@keyframes art-spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}</style><div id="art"></div><p id="status">Loading artwork… If it does not load, <a href="https://editor.p5js.org/" target="_blank" rel="noopener">open the p5.js editor</a>.</p><div id="artCursor" aria-hidden="true"></div><script src="./p5.min.js"></script><script src="./time-machine.js"></script><script>(()=>{const cursor=document.getElementById('artCursor');let last=0;addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;cursor.style.translate=e.clientX+'px '+e.clientY+'px';if(performance.now()-last<42)return;last=performance.now();const s=document.createElement('i');s.className='art-spark';s.style.left=(e.clientX-2)+'px';s.style.top=(e.clientY-2)+'px';s.style.setProperty('--dx',(Math.random()*18-9)+'px');s.style.setProperty('--dy',(8+Math.random()*18)+'px');document.body.append(s);setTimeout(()=>s.remove(),560);});})();</script></html>
