<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#07111f"/>
  <text x="60" y="65" fill="#d8f7ff" font-family="Arial" font-size="30" font-weight="bold">One interaction, from drawing to discovery</text>
  <g font-family="Arial" text-anchor="middle">
    <g transform="translate(60,130)"><rect width="220" height="150" rx="22" fill="#123653" stroke="#35d9ff" stroke-width="3"/><text x="110" y="45" fill="#6eeaff" font-size="22" font-weight="bold">1. PARTICIPANT</text><text x="110" y="82" fill="white" font-size="19">draws an object</text><text x="110" y="112" fill="#b8d9e8" font-size="16">mouse / drawing canvas</text></g>
    <g transform="translate(340,130)"><rect width="220" height="150" rx="22" fill="#252a52" stroke="#a48cff" stroke-width="3"/><text x="110" y="45" fill="#bcaaff" font-size="22" font-weight="bold">2. SYSTEM</text><text x="110" y="82" fill="white" font-size="19">centres + downsamples</text><text x="110" y="112" fill="#d1caef" font-size="16">28 x 28 pixel tensor</text></g>
    <g transform="translate(620,130)"><rect width="220" height="150" rx="22" fill="#3e244b" stroke="#ff70d1" stroke-width="3"/><text x="110" y="45" fill="#ff9cdf" font-size="22" font-weight="bold">3. AI MODEL</text><text x="110" y="82" fill="white" font-size="19">chooses 1 of 5 classes</text><text x="110" y="112" fill="#ebc4df" font-size="16">must reach 80% confidence</text></g>
    <g transform="translate(900,130)"><rect width="240" height="150" rx="22" fill="#153d38" stroke="#5dffc8" stroke-width="3"/><text x="120" y="45" fill="#80ffd5" font-size="22" font-weight="bold">4. WORLD OUTPUT</text><text x="120" y="82" fill="white" font-size="19">floating relic appears</text><text x="120" y="112" fill="#c5f4e5" font-size="16">explore, approach, press F</text></g>
    <g fill="#8be9ff" font-size="38"><text x="310" y="218">&#8594;</text><text x="590" y="218">&#8594;</text><text x="870" y="218">&#8594;</text></g>
  </g>
  <text x="600" y="355" text-anchor="middle" fill="#b9cddd" font-family="Arial" font-size="18">Agency moves between human expression, machine interpretation, and authored world rules.</text>
</svg>
