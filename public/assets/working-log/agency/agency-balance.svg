<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450">
  <rect width="1200" height="450" fill="#07111f"/>
  <text x="60" y="62" fill="#eefaff" font-family="Arial" font-size="30" font-weight="bold">Where agency lies</text>
  <g font-family="Arial">
    <rect x="80" y="112" width="480" height="255" rx="28" fill="#12394b" stroke="#48ddff" stroke-width="4"/>
    <text x="320" y="158" text-anchor="middle" fill="#75e8ff" font-size="25" font-weight="bold">PARTICIPANT AGENCY</text>
    <text x="130" y="207" fill="white" font-size="20">&#8226; what and how to draw</text>
    <text x="130" y="247" fill="white" font-size="20">&#8226; whether to submit or redraw</text>
    <text x="130" y="287" fill="white" font-size="20">&#8226; where to walk and what to inspect</text>
    <text x="130" y="327" fill="white" font-size="20">&#8226; whether to press F and read</text>
    <rect x="640" y="112" width="480" height="255" rx="28" fill="#3c2449" stroke="#ff78d5" stroke-width="4"/>
    <text x="880" y="158" text-anchor="middle" fill="#ff9ee2" font-size="25" font-weight="bold">SYSTEM / AUTHOR AGENCY</text>
    <text x="690" y="207" fill="white" font-size="20">&#8226; five available categories</text>
    <text x="690" y="247" fill="white" font-size="20">&#8226; preprocessing and confidence threshold</text>
    <text x="690" y="287" fill="white" font-size="20">&#8226; mesh, motion, spawn area and lifespan</text>
    <text x="690" y="327" fill="white" font-size="20">&#8226; historical description shown to player</text>
    <path d="M560 240 H640" stroke="#d2b9ff" stroke-width="6"/>
    <circle cx="600" cy="240" r="16" fill="#d2b9ff"/>
  </g>
  <text x="600" y="415" text-anchor="middle" fill="#b8cad8" font-family="Arial" font-size="18">The experience is co-authored: expressive choice enters a designed computational frame.</text>
</svg>
