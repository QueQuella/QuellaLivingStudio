name: Deploy Living Studio to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for any legacy Pages build before publishing Vite output
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 120; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: context.sha, per_page: 100
              });
              const legacy = data.workflow_runs.filter(run =>
                run.path === 'dynamic/pages/pages-build-deployment'
              );
              if (legacy.every(run => run.status === 'completed')) return;
              core.info('Waiting for legacy Pages deployment to finish.');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('Legacy Pages deployment did not finish in time.');
      - name: Clear the stalled November 7 Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const endpoint = '/repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}';
            const deployment = { ...context.repo, pages_deployment_id: '6cf0dff1d49df885ecae75afa4d26e089d6fc7c9' };
            try {
              const { data } = await github.request('GET ' + endpoint, deployment);
              core.info('Previous Pages deployment status: ' + data.status);
              if (['succeed', 'success', 'deployment_cancelled', 'cancelled', 'failure', 'failed'].includes(data.status)) return;
              await github.request('POST ' + endpoint + '/cancel', deployment);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('The previous deployment is no longer available.');
            }
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
